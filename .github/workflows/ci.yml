name: CI

# The same gates Jenkins runs, so a pull request shows the result before anyone
# has to go and look at another system. Both callers shell out to tools/gates.sh
# — there is one definition of "green" for this repo, not two that drift.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The control plane refuses to start unauthenticated. A build-scoped dummy,
      # never a real secret — the API tests build their own app explicitly.
      DNSGUARD_API_TOKEN: ci-build-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt

      - name: Install actionlint and shellcheck
        run: |
          set -euo pipefail
          # Both pinned: an unpinned linter turns an upstream release into a red
          # build on an unrelated pull request. actionlint runs shellcheck over
          # every `run:` block when it can find it, so the pair has to move
          # together or the local and CI results diverge.
          ACTIONLINT=1.7.7
          SHELLCHECK=0.10.0
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          install "/tmp/shellcheck-v${SHELLCHECK}/shellcheck" /usr/local/bin/shellcheck
          actionlint --version
          shellcheck --version

      # Each gate is its own step so a red run names what broke in the job
      # summary rather than in the middle of a wall of output.
      - name: Lint
        run: sh tools/gates.sh lint
      - name: Format
        run: sh tools/gates.sh format
      - name: Typecheck
        run: sh tools/gates.sh typecheck
      - name: Test
        run: sh tools/gates.sh test
      - name: JSON contract
        run: sh tools/gates.sh json
      - name: Workflows
        run: sh tools/gates.sh yaml
      - name: Cloud function
        run: sh tools/gates.sh node
      - name: Dashboard
        run: sh tools/gates.sh dashboard
      - name: Secret hygiene
        run: sh tools/gates.sh secrets
      - name: Gate script
        run: sh tools/gates.sh shell
      - name: Build
        run: sh tools/gates.sh build

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: gate-reports/
          retention-days: 14
          if-no-files-found: warn
